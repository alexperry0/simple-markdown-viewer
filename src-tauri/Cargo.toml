[package]
name = "tally"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tally_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Pin transitive deps to versions compatible with Rust 1.83
time = ">=0.3.0, <0.3.37"
