[package]
name = "tally"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tally_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Not used directly: pins tauri's transitive `time` dependency below 0.3.37,
# whose later releases require a newer rustc than older stable toolchains.
time = ">=0.3.0, <0.3.37"
