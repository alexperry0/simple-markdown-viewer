[package]
name = "simple-markdown-viewer"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "simple_markdown_viewer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-mini = "0.4"
# Pin transitive deps to versions compatible with Rust 1.83
time = ">=0.3.0, <0.3.37"
