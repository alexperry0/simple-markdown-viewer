<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tally</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23059669'/%3E%3Cpath d='M16 6a10 10 0 0 1 0 20z' fill='%23fff' opacity='0.85'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◗</span> Tally
      </div>
      <div class="date-nav" id="date-nav">
        <button class="btn-icon" id="date-prev" title="Previous day" aria-label="Previous day">‹</button>
        <button class="date-label" id="date-label" title="Jump to today">Today</button>
        <button class="btn-icon" id="date-pick-btn" title="Pick a date" aria-label="Pick a date">📅</button>
        <input type="date" id="date-picker" class="date-picker" aria-hidden="true" tabindex="-1">
        <button class="btn-icon" id="date-next" title="Next day" aria-label="Next day">›</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab active" role="tab" aria-selected="true" data-tab="diary">Diary</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="workouts">Workouts</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="trends">Trends</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="settings">Settings</button>
    </nav>
  </header>

  <main id="main">
    <section id="view-diary" class="view" role="tabpanel"></section>
    <section id="view-workouts" class="view hidden" role="tabpanel"></section>
    <section id="view-trends" class="view hidden" role="tabpanel"></section>
    <section id="view-settings" class="view hidden" role="tabpanel"></section>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
